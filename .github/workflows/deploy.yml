name: Deploy Back Alba a Producción

# Por ahora SOLO se dispara a mano.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || true

      # Guarda una copia de lo que hay en el servidor ANTES de tocar nada.
      - name: Backup del código actual en el servidor
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=10 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /home/u979626107/domains/oridheansoft.com/apis/apigrupoalbasalud/
          mkdir -p ../backups_apigrupoalbasalud
          zip -r "../backups_apigrupoalbasalud/backup-$(date +%Y%m%d-%H%M%S).zip" . \
            -x "*.zip" -x "vendor/*" -x "node_modules/*" -x "storage/*"
          cd ../backups_apigrupoalbasalud && ls -1t backup-*.zip | tail -n +6 | xargs -r rm --
          EOF

      # DRY RUN primero: solo muestra qué archivos cambiarían.
      # OJO: el destino real es la carpeta apis/, NO public_html/ —
      # esa última es solo la "puerta de entrada" (index.php + symlink),
      # el código de verdad vive acá, mismo patrón que ospf.
      - name: Upload files to Hostinger (DRY RUN)
        run: |
          rsync -avzn --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=10" \
            --exclude 'storage/' \
            --exclude 'public/' \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'apiGrupoAlba.zip' \
            --exclude 'apiGrupoAlba_ultimo.zip' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u979626107/domains/oridheansoft.com/apis/apigrupoalbasalud/

      # Cuando confirmemos que el dry-run se ve bien, esto pasa a correr
      # de verdad, y recién ahí sumamos comandos remotos de limpieza de
      # cachés (sin composer install ni migraciones, como en Coqsa).